# Publish viz/ to GitHub Pages. With no server there, the page replays viz/flights/ (viz/record.py).
name: pages

on:
  push:
    branches: [main]
    paths: [viz/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave out the live server and recorder
        run: rm -f viz/server.py viz/record.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz
      - id: deployment
        uses: actions/deploy-pages@v4
