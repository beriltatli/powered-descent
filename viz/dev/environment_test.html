<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #fff; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; }
  #ui label { display: block; margin-top: 4px; }
  #ui button { margin-right: 4px; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <button id="bDust">Dust: off</button>
  <button id="bGround">Ground view</button>
  <button id="bHigh">1500 m view</button>
  <label>Nozzle height <input id="sH" type="range" min="0.5" max="60" step="0.1" value="6"> <span id="vH"></span> m</label>
  <label>Throttle <input id="sT" type="range" min="0" max="1" step="0.01" value="0.8"> <span id="vT"></span></label>
  <div id="info"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createEnvironment } from '../js/environment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200000);
camera.position.set(12, 4, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.maxDistance = 20000;

let manifest = null;
try { const r = await fetch('../assets/manifest.json'); if (r.ok) manifest = await r.json(); } catch (e) { /* procedural fallback */ }

const env = await createEnvironment({ renderer, scene, camera, manifest, assetBase: '../' });

// stand-in lander: a box with six nozzle exits 0.5 m below its body
const lander = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 2.4), new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.8, roughness: 0.35 }));
body.castShadow = true;
lander.add(body);
scene.add(lander);
const nozzleLocal = [];
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  nozzleLocal.push(new THREE.Vector3(Math.cos(a) * 0.9, -0.8, Math.sin(a) * 0.9));
}

const ui = (id) => document.getElementById(id);
let dustOn = false, height = 6, throttle = 0.8;
ui('bDust').onclick = () => { dustOn = !dustOn; ui('bDust').textContent = 'Dust: ' + (dustOn ? 'on' : 'off'); };
ui('bGround').onclick = () => { camera.position.set(6, 2.5, 6); controls.target.set(0, 1.5, 0); };
ui('bHigh').onclick = () => { camera.position.set(2000, 1500, 0); controls.target.set(0, 0, 0); };
ui('sH').oninput = (e) => { height = +e.target.value; };
ui('sT').oninput = (e) => { throttle = +e.target.value; };
addEventListener('keydown', (e) => { if (e.key === 'd') ui('bDust').click(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const down = new THREE.Vector3(0, -1, 0);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  lander.position.set(0, height + 0.8, 0);   // nozzle exits end up at `height` above the pad
  lander.updateMatrixWorld(true);
  const nozzles = nozzleLocal.map((p) => ({ position: p.clone().applyMatrix4(lander.matrixWorld), direction: down }));
  env.dust.update(dt, { nozzles, throttle, active: dustOn });
  controls.update();
  env.update(dt, { camera, focus: lander.position });
  ui('vH').textContent = height.toFixed(1);
  ui('vT').textContent = throttle.toFixed(2);
  ui('info').textContent = 'draw calls ' + renderer.info.render.calls + '  tris ' + (renderer.info.render.triangles / 1e6).toFixed(2) + 'M';
  renderer.render(scene, camera);
});
</script>
</body>
</html>
