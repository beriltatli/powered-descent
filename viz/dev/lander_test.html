<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lander test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px system-ui, sans-serif; color: #eee; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 6px; display: grid; gap: 6px; }
  #ui label { display: grid; grid-template-columns: 70px 180px 40px; align-items: center; gap: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <label>Throttle <input id="thr" type="range" min="0.3" max="0.8" step="0.01" value="0.55"><span id="thrv">0.55</span></label>
  <label>Height <input id="h" type="range" min="0" max="12" step="0.1" value="3"><span id="hv">3.0</span></label>
  <label>Tilt <input id="tilt" type="range" min="0" max="30" step="1" value="0"><span id="tiltv">0</span></label>
  <label>Engines <input id="act" type="checkbox" checked><span></span></label>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createLander } from '../js/lander.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9a58a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(6, 3.5, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);

const sun = new THREE.DirectionalLight(0xfff0e0, 3.2);
sun.position.set(8, 12, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0003;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x9a6a4a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const lander = createLander();
scene.add(lander.object);

const $ = (id) => document.getElementById(id);
function apply() {
  const t = +$('thr').value, h = +$('h').value, tilt = +$('tilt').value * Math.PI / 180;
  $('thrv').textContent = t.toFixed(2); $('hv').textContent = h.toFixed(1); $('tiltv').textContent = $('tilt').value;
  lander.object.position.set(0, h, 0);
  lander.object.rotation.set(0, 0, tilt);
  lander.setEngines(new Array(6).fill(t), $('act').checked);
}
for (const id of ['thr', 'h', 'tilt', 'act']) $(id).addEventListener('input', apply);
apply();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  lander.update(clock.getDelta(), camera);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
